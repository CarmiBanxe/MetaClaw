[project]
name = "banxe-guardian"
version = "0.1.0"
description = "BANXE AI Guardian (Layer 6) — two-family architecture compliance enforcement"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "clickhouse-connect>=0.8",
  "httpx>=0.28",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
