router_settings:
  routing_strategy: least-busy
  num_retries: 2
  retry_after: 5
  allowed_fails: 1
  cooldown_time: 300
  timeout: 120
  fallbacks:
  - smart:
    - claude-primary
    - gpt-fallback
    - banxe-general
  - coding:
    - factory-fast
    - reasoning-heavy
  - coding-heavy:
    - factory-fast
  - factory-coder:
    - factory-fast
  - factory-mid:
    - factory-fast
  - banxe-general:
    - qwen3-30b
    - fast
    - factory-fast
  - reasoning:
    - reasoning-heavy
  - grok:
    - senior-claude
  context_window_fallbacks:
  - grok:
    - senior-claude
litellm_settings:
  success_callback:
  - prometheus
  failure_callback:
  - prometheus
  drop_params: true
cache: false
cache_params:
  type: redis
  host: 100.99.208.21
  port: 6379
  namespace: banxe-litellm
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  background_health_checks: false
  health_check_interval: 300
  health_check_details: false
