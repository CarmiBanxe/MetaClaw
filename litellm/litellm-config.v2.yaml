      api_key: sk-banxe-evo1-local-2026
      timeout: 120

  # coding — qwen3-coder-next:q4_K_M, evo1 primary (no fallback yet, see router fallbacks below)
  - model_name: coding
    litellm_params:
      model: ollama/qwen3-coder-next:q4_K_M
      api_base: http://192.168.0.72:11434
      api_key: sk-banxe-evo1-local-2026
      timeout: 240

  # gpt-oss-20b — evo1 only
