# BANXE LiteLLM LAN Gateway v2 (S4)
# Sprint 4 — port 4000, bind 0.0.0.0, LAN-only Ollama backends.
# Cloud providers (Anthropic/Gemini/Groq) and BANXE/UK-GDPR compliance routes
# stay on the prod gateway at 127.0.0.1:8080 (DO NOT mirror them here).

model_list:
  # banxe-general (qwen3:30b-a3b) — load-balanced across evo1 + evo2
  - model_name: banxe-general
    litellm_params:
      model: ollama/qwen3:30b-a3b
      api_base: http://192.168.0.72:11434
      api_key: sk-banxe-evo1-local-2026
      timeout: 120
  - model_name: banxe-general
    litellm_params:
      model: ollama/qwen3:30b-a3b
      api_base: http://192.168.0.15:11434
      api_key: sk-banxe-evo2-local-2026
      timeout: 120

  # qwen3-30b — backwards-compat alias, same LB pair
  - model_name: qwen3-30b
    litellm_params:
      model: ollama/qwen3:30b-a3b
      api_base: http://192.168.0.72:11434
      api_key: sk-banxe-evo1-local-2026
      timeout: 120
  - model_name: qwen3-30b
