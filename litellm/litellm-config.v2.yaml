router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 120
  retry_after: 5
  fallbacks:
    - coding: ["qwen3-30b"]
    - banxe-general: ["fast"]

litellm_settings:
  success_callback: ["prometheus"]
  failure_callback: ["prometheus"]
  drop_params: true

cache: true
cache_params:
  type: redis
  host: 192.168.0.72
  port: 6379
  namespace: banxe-litellm

general_settings:
  master_key: sk-banxe-llm-gateway-2026
